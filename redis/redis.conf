protected-mode yes
bind 0.0.0.0
port 6379
tcp-backlog 128
timeout 300
tcp-keepalive 60

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN SHUTDOWN_9f3ab2

maxmemory 96mb
maxmemory-policy allkeys-lru

appendonly yes
appendfsync everysec
